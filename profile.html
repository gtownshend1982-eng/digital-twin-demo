<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile</title>
<link rel="stylesheet" href="css.css">
<style>
.page { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
.top { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:22px; }
.top img { width:min(280px,100%); aspect-ratio:3/4; object-fit:cover; border-radius:4px; }
.wa { max-width: 520px; background:#0b141a; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; min-height:520px; }
.wa-head { background:#202c33; display:flex; align-items:center; gap:10px; padding:10px 12px; color:#fff; }
.wa-head img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
.wa-thread { flex:1; padding:14px 12px; overflow-y:auto; max-height:360px; }
.row { display:flex; margin:6px 0; }
.row.me { justify-content:flex-end; }
.bubble { max-width:78%; padding:8px 10px; border-radius:10px; color:#e9edef; white-space:pre-wrap; }
.row.them .bubble { background:#202c33; }
.row.me .bubble { background:#005c4b; }
.wa-form { display:flex; gap:8px; padding:10px; background:#202c33; }
.wa-form input { flex:1; border:0; border-radius:20px; padding:10px 14px; background:#2a3942; color:#fff; }
.wa-form button { border:0; border-radius:20px; padding:10px 16px; background:#00a884; font-weight:700; }
.book-now { margin:0 10px 10px; padding:12px; background:#c9a227; border:0; border-radius:12px; font-weight:700; }
.err { padding:24px; background:#fee; font-family:sans-serif; }
</style>
</head>
<body>
<div class="page" id="page">
  <a id="back" href="index.html">Back</a>
  <div class="top">
    <img id="photo" alt="">
    <div>
      <h1 id="name"></h1>
      <div id="sub"></div>
      <p id="about"></p>
      <div id="facts"></div>
    </div>
  </div>
  <div class="wa">
    <div class="wa-head">
      <img id="ava" alt="">
      <div>
        <div id="waname"></div>
        <div style="color:#8696a0;font-size:.75rem">online</div>
      </div>
    </div>
    <div class="wa-thread" id="thread"></div>
    <form class="wa-form" id="form">
      <input id="msg" autocomplete="off" placeholder="Message" />
      <button type="submit">Send</button>
    </form>
    <button type="button" id="booknow" class="book-now">Book me now</button>
  </div>
</div>
<script src="profiles.js"></script>
<script src="examples.js"></script>
<script src="examples-a.js"></script>
<script src="examples-b.js"></script>
<script src="chat-engine.js"></script>
<script>
(function () {
  var page = document.getElementById("page");
  function fail(msg) {
    page.innerHTML = "<div class='err'><p><b>Chat cannot start.</b></p><p>" + msg + "</p></div>";
  }
  if (!window.PROFILES) { fail("profiles.js did not load."); return; }
  var id = (new URLSearchParams(location.search).get("id") || "ben").toLowerCase();
  var p = window.PROFILES[id];
  if (!p) { fail("Unknown persona: " + id); return; }
  if (!window.twinReply) { fail("chat-engine.js did not load."); return; }
  document.title = p.name;
  document.getElementById("back").href = p.wing === "female" ? "female.html" : p.wing === "male" ? "male.html" : "trans.html";
  document.getElementById("photo").src = (p.photo || "") + "?v=3";
  document.getElementById("ava").src = (p.photo || "") + "?v=3";
  document.getElementById("name").textContent = p.name;
  document.getElementById("waname").textContent = p.name;
  document.getElementById("sub").textContent = (p.brief || "") + " \u00b7 " + (p.age || "");
  document.getElementById("about").textContent = p.about || "";
  document.getElementById("facts").textContent = p.city || "";
  var thread = document.getElementById("thread");
  var state = { turns: 0, guestName: "" };
  var history = [];
  var API = (location.protocol === "http:" || location.protocol === "https:") ? "/api/chat" : "http://127.0.0.1:3000/api/chat";
  function add(text, who) {
    if (!text) return;
    var row = document.createElement("div");
    row.className = "row " + who;
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }
  add(window.twinOpening ? window.twinOpening(p) : ("Hi im " + p.name + " who am i talking with"), "them");
  function send(text) {
    add(text, "me");
    if (window.twinCaptureName) window.twinCaptureName(text, state);
    history.push({ role: "user", content: text });
    var typing = document.createElement("div");
    typing.className = "row them";
    typing.id = "typing";
    typing.innerHTML = "<div class='bubble'>\u2026</div>";
    thread.appendChild(typing);
    thread.scrollTop = thread.scrollHeight;
    function finish(reply) {
      var el = document.getElementById("typing");
      if (el) el.remove();
      history.push({ role: "assistant", content: reply });
      add(reply, "them");
    }
    fetch(API, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ personaId: p.id, message: text, guestName: state.guestName || "", history: history.slice(-12) })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.reply) finish(j.reply);
      else finish(window.twinReply(p, text, state));
    }).catch(function () {
      finish(window.twinReply(p, text, state));
    });
  }
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var input = document.getElementById("msg");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  };
  document.getElementById("booknow").onclick = function () { send("ok i'll hit book me now"); };
})();
</script>
</body>
</html>
