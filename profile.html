<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css.css">
<style>
.page { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; position: relative; z-index: 1; }
.top { display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; margin-bottom:22px; }
.top img { width:min(280px,100%); aspect-ratio:3/4; object-fit:cover; border-radius:4px; border:1px solid var(--line); box-shadow:0 12px 40px rgba(0,0,0,.45); }
.bio h1 { font-family:"Cormorant Garamond",serif; font-size:2.4rem; }
.bio .sub { color:var(--gold); letter-spacing:.08em; text-transform:uppercase; font-size:.75rem; margin:6px 0 12px; }
.bio p { color:#e5e7eb; line-height:1.55; max-width:36rem; }
.facts { margin-top:14px; color:var(--muted); font-size:.9rem; line-height:1.6; }
.wa { max-width: 520px; margin: 8px 0 0; background:#0b141a; border:1px solid var(--line); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; min-height:520px; }
.wa-head { background:#202c33; display:flex; align-items:center; gap:10px; padding:10px 12px; }
.wa-head img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
.wa-head .nm { font-weight:600; font-size:.95rem; }
.wa-head .st { font-size:.72rem; color:#8696a0; }
.wa-thread { flex:1; padding:14px 12px 8px; overflow-y:auto; max-height:360px; background:#0b141a; }
.row { display:flex; margin:6px 0; }
.row.me { justify-content:flex-end; }
.bubble { max-width:78%; padding:8px 10px; border-radius:10px; font-size:.9rem; line-height:1.4; white-space:pre-wrap; }
.row.them .bubble { background:#202c33; color:#e9edef; border-top-left-radius:3px; }
.row.me .bubble { background:#005c4b; color:#e9edef; border-top-right-radius:3px; }
.wa-form { display:flex; gap:8px; padding:10px; background:#202c33; }
.wa-form input { flex:1; border:0; border-radius:20px; padding:10px 14px; background:#2a3942; color:#fff; font:inherit; }
.wa-form button { border:0; border-radius:20px; padding:10px 16px; background:#00a884; color:#042; font-weight:700; cursor:pointer; }
.book-now { width: calc(100% - 20px); margin: 0 10px 10px; border:0; border-radius:12px; padding:12px 16px; background:#c9a227; color:#111; font-weight:700; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<div class="page">
  <a class="back" id="back" href="index.html">← Back</a>
  <div class="top">
    <img id="photo" alt="">
    <div class="bio">
      <h1 id="name"></h1>
      <div class="sub" id="sub"></div>
      <div class="badges" style="position:static;margin:8px 0 12px">
        <span class="chip">Verified</span>
        <span class="chip on">Available</span>
        <span class="chip" id="minchip">1 hour min</span>
      </div>
      <p id="about"></p>
      <div class="facts" id="facts"></div>
    </div>
  </div>
  <div class="wa">
    <div class="wa-head">
      <img id="ava" alt="">
      <div>
        <div class="nm" id="waname"></div>
        <div class="st">online · demo chat</div>
      </div>
    </div>
    <div class="wa-thread" id="thread"></div>
    <form class="wa-form" id="form">
      <input id="msg" autocomplete="off" placeholder="Message…" />
      <button type="submit">Send</button>
    </form>
    <button type="button" id="booknow" class="book-now">Book me now</button>
  </div>
</div>
<script src="profiles.js?v=20260904b"></script>
<script src="chat-engine.js?v=20260904b"></script>
<script>
(function () {
  var id = (new URLSearchParams(location.search).get("id") || "").toLowerCase();
  var p = (window.PROFILES || {})[id];
  if (!window.PROFILES || !p) {
    document.querySelector(".page").innerHTML = "<p style='padding:40px'>Need profiles.js and chat-engine.js next to this file.</p>";
    return;
  }
  document.title = p.name + " — Capital Companions";
  document.getElementById("back").href = p.wing === "female" ? "female.html" : p.wing === "male" ? "male.html" : "trans.html";
  document.getElementById("photo").src = p.photo + "?v=2";
  document.getElementById("photo").alt = p.name;
  document.getElementById("ava").src = p.photo + "?v=2";
  document.getElementById("name").textContent = p.name;
  document.getElementById("waname").textContent = p.name;
  document.getElementById("sub").textContent = (p.brief || "") + " · " + p.age;
  document.getElementById("about").textContent = p.about || "";
  var mc=document.getElementById("minchip");
  if(mc) mc.textContent = (p.minDuration || "1 hour") + " min";
  document.getElementById("facts").textContent = [p.city].filter(Boolean).join(" · ");
  var thread = document.getElementById("thread");
  var state = { turns: 0, guestName: "" };
  var history = [];
  function add(text, who) {
    if (!text) return;
    var row = document.createElement("div");
    row.className = "row " + who;
    var b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }
  var opening = window.twinOpening ? window.twinOpening(p) : ("Hi im " + p.name + " who am i talking with");
  add(opening, "them");
  history.push({ role: "assistant", content: opening });
  async function send(text) {
    add(text, "me");
    if (window.twinCaptureName) window.twinCaptureName(text, state);
    history.push({ role: "user", content: text });
    var reply = window.twinReply ? window.twinReply(p, text, state) : "Yeah.";
    history.push({ role: "assistant", content: reply });
    add(reply, "them");
  }
  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();
    var input = document.getElementById("msg");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  };
  document.getElementById("booknow").onclick = function () { send("I'd like to book"); };
})();
</script>
</body>
</html>
